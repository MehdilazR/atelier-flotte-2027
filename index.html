<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier flotte 2027 · pondération et classement</title>
<style>body{margin:0;background:#1D1B1C;color:#fff;font:600 15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}</style>
</head><body><p id="m">Chargement de l'atelier…</p>
<script>
/* Charge toujours la dernière version publiée (évite la copie gardée en cache par le navigateur) */
(function(){
  var url='app.html?_='+Date.now();
  fetch(url,{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
  .then(function(t){ document.open(); document.write(t); document.close(); })
  .catch(function(){ location.replace('app.html'+location.hash); });
})();
</script></body></html>
